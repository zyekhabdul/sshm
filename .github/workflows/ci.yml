name: CI & Packaging

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y fzf shellcheck
      - name: Lint shell script
        run: shellcheck bin/sshm
      - name: Run syntax tests
        run: bash -n bin/sshm
      - name: Test help and version
        run: |
          ./bin/sshm --version
          ./bin/sshm --help
      - name: Build Debian Package
        run: bash packaging/debian/build-deb.sh
      - name: Upload Debian Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: packaging/debian/*.deb
