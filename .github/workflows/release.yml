name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Packages & GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Debian .deb Package
        run: |
          chmod +x packaging/debian/build-deb.sh
          ./packaging/debian/build-deb.sh

      - name: Create Tarball Archive
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          tar -czf sshm-${VERSION}.tar.gz bin/ LICENSE README.md install.sh

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packaging/debian/sshm_*_all.deb
            sshm-*.tar.gz
          generate_release_notes: true
